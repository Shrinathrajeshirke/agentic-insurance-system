name: CI Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Deterministic Guardrail & Actuarial Tests
        env:
          OPENAI_API_KEY: "mock-key-for-unit-testing"
          JWT_SECRET_KEY: "ci-test-secret-key"
        run: |
          pytest tests/test_guardrails_calculator.py -v --durations=10